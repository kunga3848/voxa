name: Build Voxa

# Se lance à chaque push sur main, à la main (onglet Actions), ou sur un tag v1.0.0 (=> crée une Release).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: app/release/*.exe
          - os: macos-latest
            target: --mac
            files: app/release/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # pas de certificat de signature
      - uses: actions/upload-artifact@v4
        with:
          name: voxa-${{ matrix.os }}
          path: ${{ matrix.files }}

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Permissions micro + réseau local
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          grep -n "permission\|usesCleartext" $M
      - name: Icônes
        run: npx capacitor-assets generate --android --iconBackgroundColor '#2E43D1' --splashBackgroundColor '#F2F3F6' --splashBackgroundColorDark '#11141A'
        continue-on-error: true
      - run: npx cap sync android
      - name: Compilation APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../release && cp app/build/outputs/apk/debug/app-debug.apk ../release/Voxa-${GITHUB_REF_NAME//\//-}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: voxa-android
          path: app/release/*.apk

  web:
    name: Web + moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build.mjs
      - name: Paquet moteur + interface web
        working-directory: .
        run: |
          mkdir -p out/Voxa-Engine
          cp -r engine out/Voxa-Engine/engine
          mkdir -p out/Voxa-Engine/app && cp -r app/dist out/Voxa-Engine/app/dist
          cp README.md out/Voxa-Engine/
          cd out && zip -qr Voxa-Engine.zip Voxa-Engine
      - uses: actions/upload-artifact@v4
        with:
          name: voxa-engine
          path: out/Voxa-Engine.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
