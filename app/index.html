<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11141A" media="(prefers-color-scheme: dark)">
  <title>Voxa</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="11" width="3" height="6" rx="1.5"/><rect x="9" y="6" width="3" height="16" rx="1.5"/><rect x="15" y="3" width="3" height="22" rx="1.5"/><rect x="21" y="9" width="3" height="10" rx="1.5"/></svg>
      <span>voxa</span>
      <span class="beta" data-i18n="beta"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="studio" aria-selected="true">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h13"/></svg><span data-i18n="tabStudio"></span></button>
      <button role="tab" data-tab="voices">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-i18n="tabVoices"></span></button>
      <button role="tab" data-tab="history">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-i18n="tabHistory"></span></button>
      <button role="tab" data-tab="settings">
        <svg viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg><span data-i18n="tabSettings"></span></button>
    </nav>
    <div class="top-right">
      <span class="status" id="status"><i></i><span></span></span>
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="fr">FR</button><button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main>
    <!-- STUDIO -->
    <section class="view" id="view-studio">
      <div class="studio">
        <div class="sheet">
          <input class="title-input" id="title" data-i18n-ph="titlePlaceholder" maxlength="80">
          <textarea id="script" data-i18n-ph="scriptPlaceholder" spellcheck="true"></textarea>
          <div class="sheet-foot"><span id="chars"></span><span id="estimate"></span></div>
        </div>

        <aside class="controls">
          <div class="field">
            <span data-i18n="voice"></span>
            <button type="button" class="voice-chip" id="voice-chip" aria-haspopup="dialog">
              <span class="avatar" id="vc-avatar" aria-hidden="true">V</span>
              <span class="vc-text"><b id="vc-name">Voxa</b><small id="vc-tags"></small></span>
              <span class="vc-change" data-i18n="change"></span>
            </button>
          </div>
          <label class="field">
            <span data-i18n="language"></span>
            <select id="language"></select>
          </label>
          <label class="field">
            <span data-i18n="tone"></span>
            <select id="tone"></select>
            <small id="tone-hint"></small>
          </label>
          <div class="two-col">
            <label class="field" id="effect-field">
              <span data-i18n="effect"></span>
              <select id="effect"></select>
            </label>
            <label class="field" id="finish-field">
              <span data-i18n="finish"></span>
              <select id="finish"></select>
            </label>
          </div>
          <div class="field">
            <span data-i18n="takes"></span>
            <div class="seg" id="takes" role="radiogroup">
              <button role="radio" data-v="1" aria-checked="true">1</button>
              <button role="radio" data-v="2" aria-checked="false">2</button>
              <button role="radio" data-v="3" aria-checked="false">3</button>
            </div>
            <small data-i18n="takesHint"></small>
          </div>

          <details class="advanced" id="advanced">
            <summary data-i18n="advanced"></summary>
            <div class="advanced-body">
              <div class="field slider">
                <div class="row"><label for="exaggeration" data-i18n="expressiveness"></label><output id="o-exaggeration"></output></div>
                <input type="range" id="exaggeration" min="0.25" max="1.2" step="0.05" value="0.5">
                <small data-i18n="expressivenessHint"></small>
              </div>
              <div class="field slider">
                <div class="row"><label for="stability" data-i18n="stability"></label><output id="o-stability"></output></div>
                <input type="range" id="stability" min="0" max="1" step="0.05" value="0.5">
                <small data-i18n="stabilityHint"></small>
              </div>
              <div class="field slider">
                <div class="row"><label for="temperature" data-i18n="variation"></label><output id="o-temperature"></output></div>
                <input type="range" id="temperature" min="0.3" max="1.2" step="0.05" value="0.8">
                <small data-i18n="variationHint"></small>
              </div>
              <div class="field slider">
                <div class="row"><label for="speed" data-i18n="speed"></label><output id="o-speed"></output></div>
                <input type="range" id="speed" min="0.7" max="1.3" step="0.05" value="1">
              </div>
              <div class="field slider">
                <div class="row"><label for="pause" data-i18n="pause"></label><output id="o-pause"></output></div>
                <input type="range" id="pause" min="0" max="1.2" step="0.05" value="0.25">
              </div>
              <label class="check"><input type="checkbox" id="normalize" checked><span data-i18n="normalizeText"></span></label>
              <div class="field">
                <span data-i18n="format"></span>
                <div class="seg" id="format" role="radiogroup">
                  <button role="radio" data-v="wav" aria-checked="true">WAV</button>
                  <button role="radio" data-v="mp3" aria-checked="false">MP3</button>
                </div>
              </div>
            </div>
          </details>

          <button class="primary" id="generate"><span data-i18n="generate"></span></button>
          <small class="muted note" id="cloud-note" hidden></small>
        </aside>
      </div>

      <div class="result" id="result">
        <p class="empty" data-i18n="resultEmpty"></p>
      </div>
    </section>

    <!-- VOIX -->
    <section class="view" id="view-voices" hidden>
      <div class="narrow">
        <form class="clone" id="clone-form">
          <h2 data-i18n="cloneTitle"></h2>
          <p class="muted" data-i18n="cloneIntro"></p>
          <div class="two">
            <label class="field"><span data-i18n="voiceName"></span><input id="v-name" maxlength="60" required></label>
            <label class="field"><span data-i18n="voiceDesc"></span><input id="v-desc" maxlength="140"></label>
          </div>
          <div class="three">
            <label class="field"><span data-i18n="gender"></span><select id="v-gender"></select></label>
            <label class="field"><span data-i18n="origin"></span><select id="v-origin"></select></label>
            <label class="field"><span data-i18n="sampleLanguage"></span><select id="v-lang"></select></label>
          </div>
          <div class="sample-pick">
            <label class="ghost file-btn">
              <svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v4h14v-4"/></svg>
              <span data-i18n="importFile"></span>
              <input type="file" id="v-file" accept="audio/*" hidden>
            </label>
            <button type="button" class="ghost" id="v-record">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" class="fill"/></svg>
              <span data-i18n="record"></span>
            </button>
          </div>
          <div class="sample-state" id="v-sample" hidden></div>
          <label class="consent">
            <input type="checkbox" id="v-consent">
            <span><span data-i18n="consent"></span> <span class="muted" id="consent-cloud" data-i18n="consentCloud" hidden></span></span>
          </label>
          <button class="primary" id="v-create" type="submit"><span data-i18n="createVoice"></span></button>
        </form>

        <div class="voice-lists" id="voice-lists"></div>

        <section class="kit" id="kit">
          <h2 data-i18n="kitTitle"></h2>
          <p class="muted" data-i18n="kitIntro"></p>
          <ol class="kit-steps">
            <li data-i18n="kitStep1"></li>
            <li data-i18n="kitStep2"></li>
            <li data-i18n="kitStep3"></li>
            <li data-i18n="kitStep4"></li>
          </ol>
          <div class="kit-scripts">
            <div class="kit-script"><div class="row"><b>Français</b><button type="button" class="ghost small" data-copy="kitFr" data-i18n="copy"></button></div><p id="kitFr"></p></div>
            <div class="kit-script"><div class="row"><b>English</b><button type="button" class="ghost small" data-copy="kitEn" data-i18n="copy"></button></div><p id="kitEn"></p></div>
          </div>
        </section>
      </div>
    </section>

    <!-- HISTORIQUE -->
    <section class="view" id="view-history" hidden>
      <div class="narrow"><ul class="history" id="history"></ul></div>
    </section>

    <!-- RÉGLAGES -->
    <section class="view" id="view-settings" hidden>
      <form class="narrow settings" id="settings-form">
        <div class="field">
          <span data-i18n="engineMode"></span>
          <div class="seg" id="s-mode" role="radiogroup">
            <button type="button" role="radio" data-v="cloud" data-i18n="modeCloud"></button>
            <button type="button" role="radio" data-v="local" data-i18n="modeLocal"></button>
          </div>
          <small id="s-mode-hint"></small>
        </div>
        <div id="cloud-fields" class="group">
          <label class="field">
            <span data-i18n="hfToken"></span>
            <input id="s-hf" type="password" autocomplete="off" placeholder="hf_…">
            <small data-i18n="hfTokenHint"></small>
          </label>
        </div>
        <div id="local-fields" class="group">
          <label class="field">
            <span data-i18n="server"></span>
            <input id="s-server" inputmode="url" autocomplete="off" spellcheck="false">
            <small data-i18n="serverHint"></small>
          </label>
          <label class="field">
            <span data-i18n="apiKey"></span>
            <input id="s-key" type="password" autocomplete="off">
            <small data-i18n="apiKeyHint"></small>
          </label>
        </div>
        <div class="field">
          <span data-i18n="theme"></span>
          <div class="seg" id="s-theme" role="radiogroup">
            <button type="button" role="radio" data-v="auto" data-i18n="themeAuto"></button>
            <button type="button" role="radio" data-v="light" data-i18n="themeLight"></button>
            <button type="button" role="radio" data-v="dark" data-i18n="themeDark"></button>
          </div>
        </div>
        <button class="primary" type="submit"><span data-i18n="save"></span></button>
        <div class="field feedback">
          <button type="button" class="ghost" id="feedback"><span data-i18n="feedback"></span></button>
          <small data-i18n="feedbackHint"></small>
        </div>
        <p class="muted version" id="version"></p>
      </form>
    </section>
  </main>

  <dialog class="picker" id="picker" aria-labelledby="picker-title">
    <div class="picker-head">
      <h2 id="picker-title" data-i18n="pickVoice"></h2>
      <button type="button" class="icon-btn" id="picker-close" data-i18n-aria="close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="filters">
      <div class="chips" id="f-gender" role="group"></div>
      <div class="chips" id="f-origin" role="group"></div>
      <div class="chips" id="f-style" role="group"></div>
    </div>
    <div class="voice-grid" id="voice-grid"></div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
